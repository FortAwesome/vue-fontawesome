name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        free-solid-svg-icons: [5.x, 6.x, 7.x]
        fontawesome-svg-core: [1.2.x, 6.x, 7.x]
        fontawesome-common-types: [7.x]
        node-version: [20.x, 22.x]
        vue: [3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x]
        exclude:
          # Exclude 7.x common-types from 5.x tests
          - free-solid-svg-icons: '5.x'
            fontawesome-common-types: '7.x'
          # Exclude 7.x common-types from 6.x tests
          - free-solid-svg-icons: '6.x'
            fontawesome-common-types: '7.x'
          # Exclude non-7.x core from 7.x tests
          - free-solid-svg-icons: '7.x'
            fontawesome-svg-core: '1.2.x'
          - free-solid-svg-icons: '7.x'
            fontawesome-svg-core: '6.x'
          # Exclude Vue versions below 3.2 for Font Awesome 7.x
          - free-solid-svg-icons: '7.x'
            vue: '3.0.x'
          - free-solid-svg-icons: '7.x'
            vue: '3.1.x'
          - fontawesome-svg-core: '7.x'
            vue: '3.0.x'
          - fontawesome-svg-core: '7.x'
            vue: '3.1.x'
          - fontawesome-common-types: '7.x'
            vue: '3.0.x'
          - fontawesome-common-types: '7.x'
            vue: '3.1.x'

    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: v5 install, build, and test
        if: ${{ matrix.free-solid-svg-icons == '5.x' && matrix.fontawesome-common-types != '7.x' }}
        run: |
          npm install -g npm@10
          npm install
          npm install --no-save @fortawesome/fontawesome-svg-core@1.2.x @fortawesome/free-solid-svg-icons@5.x vue@${{ matrix.vue }}
          npm run build
          npm list vue
          npm run test
      - name: v6 install, build, and test
        if: ${{ matrix.free-solid-svg-icons == '6.x' && matrix.fontawesome-common-types != '7.x' }}
        run: |
          npm install -g npm@10
          npm install
          npm install --no-save @fortawesome/fontawesome-svg-core@6.x @fortawesome/free-solid-svg-icons@6.x vue@${{ matrix.vue }}
          npm run build
          npm list vue
          npm run test
      - name: v7 install, build, and test
        if: ${{ matrix.free-solid-svg-icons == '7.x' && matrix.fontawesome-svg-core == '7.x' && matrix.fontawesome-common-types == '7.x' && matrix.vue >= '3.2.x' }}
        run: |
          npm install -g npm@10
          npm install
          npm install --no-save ./fortawesome-fontawesome-svg-core-7.0.0-alpha8.tgz ./fortawesome-fontawesome-common-types-7.0.0-alpha8.tgz @fortawesome/free-solid-svg-icons@6.x vue@${{ matrix.vue }}
          npm run build
          npm list vue
          npm run test
        env:
          CI: true
      - name: dist
        run: |
          npm run dist
